<!DOCTYPE html>
<html>
<head>
    <title>Inscription - Diabète Prédiction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4>Inscription</h4>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
                        </form>
                        <hr>
                        <p class="text-center">Déjà inscrit ? <a href="{% url 'users:login' %}">Se connecter</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
